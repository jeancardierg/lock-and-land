# Builds the Windows installer and the macOS .dmg on GitHub's runners (no Mac needed).
# The tests job runs the test suite on the fictional sample profile in tests/fixtures (no personal files needed).
# A tag like v0.4.1 also publishes both installers and their checksums as a GitHub Release.
# Runs on every push to main, on tags like v0.4.0, or from the Actions tab (Run workflow).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
# The build only reads the code. Actions are pinned to exact commits (tag in the comment) so a moved tag upstream
# can't change what builds the installer. Each build also uploads SHA256 checksums to compare a download against.
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # only used by the tag-only release step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1 -SkipTests
      - name: Bundle size (biggest folders)
        shell: pwsh
        run: |
          $root = "dist\jobhunter"
          "Total: {0:N0} MB" -f ((Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem $root, "$root\_internal" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            [pscustomobject]@{ MB = [math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1); Folder = $_.Name } } |
            Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize
          Get-ChildItem dist\LockAndLand-setup-*.exe | ForEach-Object { "Installer: {0:N1} MB" -f ($_.Length / 1MB) }
      - name: SHA256 checksum
        shell: pwsh
        run: Get-ChildItem dist\LockAndLand-setup-*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Tee-Object dist\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: LockAndLand-windows
          path: |
            dist/LockAndLand-setup-*.exe
            dist/SHA256SUMS-windows.txt
      - name: Publish to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes 2>$null; $global:LASTEXITCODE = 0
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist\LockAndLand-setup-*.exe).FullName dist\SHA256SUMS-windows.txt --repo $env:GITHUB_REPOSITORY --clobber
  macos:
    runs-on: macos-latest   # Apple Silicon (M1 and newer)
    permissions:
      contents: write   # only used by the tag-only release step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: SKIP_TESTS=1 PYTHON=python bash packaging/build_mac.sh
      - name: Bundle size (biggest folders)
        run: |
          du -sh "dist/Lock & Land.app" dist/*.dmg
          du -sm "dist/Lock & Land.app/Contents/Frameworks"/* 2>/dev/null | sort -rn | head -15 || true
      - name: SHA256 checksum
        run: cd dist && shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: LockAndLand-macos-apple-silicon
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
      - name: Publish to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS-macos.txt --repo "$GITHUB_REPOSITORY" --clobber
