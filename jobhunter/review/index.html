<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock &amp; Land</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e3e2dc;--ok:#1a7f37;--warn:#9a5b00;--bad:#c8261d;--acc:#c2410c;--claim:#eaf1ff;--chip:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe6;--muted:#a3a29b;--line:#34332e;--ok:#4cc26e;--warn:#e0a643;--bad:#ff6b5f;--acc:#f26b2a;--claim:#1d2a44;--chip:#2c2b27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;flex-wrap:wrap}
header h1{font-size:17px;margin:0}nav button{background:none;border:0;color:var(--muted);font:inherit;padding:6px 10px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink)}.stat{color:var(--muted);font-size:13px;margin-left:auto}
main{max-width:980px;margin:0 auto;padding:20px 16px 120px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 6px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.pill{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.letter{white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.s-claim{background:var(--claim);border-radius:4px;cursor:help}.muted{color:var(--muted)}small{font-size:12.5px}
textarea{width:100%;min-height:320px;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.src{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip)}.src.jean{color:var(--bad)}
input[type=text]{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button,.btn{font:inherit;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.bar .go{background:var(--acc);color:#fff;border-color:var(--acc)}kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;opacity:.75}
.issues li{margin:2px 0}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;display:none;z-index:5;max-width:90vw}
.reasons{display:none;gap:6px;flex-wrap:wrap;justify-content:center}.reasons.on{display:flex}
.empty{text-align:center;padding:60px 0;color:var(--muted)}
main.wide{max-width:1280px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search],.filters select,.filters input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filters input[type=search]{flex:1 1 220px}.filters input[type=number]{width:90px}.filters label{font-size:13.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.chipf{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;background:var(--card);color:var(--muted)}.chipf.on{background:var(--acc);border-color:var(--acc);color:#fff}
.jl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.jr{display:grid;grid-template-columns:52px minmax(0,1fr) 130px 110px 120px;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.jr:hover{background:var(--chip)}.jr .t{font-weight:600}.jr .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:700;text-align:center;border-radius:8px;padding:4px 0;background:var(--chip)}.sc.hi{color:var(--ok)}.sc.mid{color:var(--warn)}.sc.lo{color:var(--muted)}
.mode{font-size:12.5px;border-radius:999px;padding:2px 9px;background:var(--chip);white-space:nowrap}.mode.remote{color:var(--ok)}.mode.onsite{color:var(--warn)}
.acct{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}.acct .btn{margin:4px 6px 0 0}.acct td{padding:4px 8px 4px 0}
.det{padding:4px 14px 14px 76px;border-bottom:1px solid var(--line);font-size:14px}.det .btn{padding:6px 12px;margin:4px 6px 0 0}
@media(max-width:760px){.jr{grid-template-columns:44px minmax(0,1fr) 90px}.jr .hide-s{display:none}.det{padding-left:14px}}
/* motion ("Lock-on"): playful but quick, never blocks input */
:root{--ease:cubic-bezier(.2,.7,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
.btn,.bar button,nav button,.chipf,.jr,header a{transition:background-color .14s ease,border-color .14s ease,color .14s ease,transform .12s ease}
.btn:active,.bar button:active{transform:scale(.95)}
main{animation:jh-in .22s var(--ease) both}
.enter{animation:jh-spring .45s var(--spring) both}
@keyframes jh-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes jh-spring{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.card{position:relative}
.hit{animation:jh-hit .32s cubic-bezier(.5,-.4,.7,1) both;pointer-events:none}
.miss{animation:jh-miss .42s ease-in both;pointer-events:none}
@keyframes jh-hit{0%{transform:none}30%{transform:scale(1.03)}100%{opacity:0;transform:translate(45%,-35%) scale(.4) rotate(10deg)}}
@keyframes jh-miss{0%{transform:none}20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}100%{opacity:0;transform:translateX(-110%) rotate(-5deg)}}
.reticle{position:absolute;left:50%;top:120px;width:150px;height:150px;margin-left:-75px;pointer-events:none;z-index:3;animation:jh-lock .38s cubic-bezier(.2,.9,.3,1.2) both}
.reticle circle.dot{animation:jh-dot .38s ease-out both}
@keyframes jh-lock{0%{opacity:0;transform:scale(1.8) rotate(-90deg)}70%{opacity:1;transform:scale(.95) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes jh-dot{0%,60%{r:0}80%{r:9}100%{r:6}}
.reasons.on,.det.enter{animation:jh-spring .3s var(--spring) both}
#toast{display:block!important;opacity:0;visibility:hidden;transform:translate(-50%,-14px) scale(.8);transition:opacity .2s ease,transform .35s var(--spring),visibility .2s}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1}#busy::after{content:"";position:absolute;inset:0;width:35%;background:var(--acc);animation:jh-load 1.1s ease-in-out infinite}
@keyframes jh-load{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;transition-duration:1ms!important}#busy::after{animation:none;width:100%;opacity:.5}.reticle{display:none}}
</style>
</head>
<body>
<header>
  <h1>Lock &amp; Land</h1>
  <nav><button id="t-review" class="on" onclick="tab('review')">To review</button><button id="t-all" onclick="tab('all')">All jobs</button><button id="t-waiting" onclick="tab('waiting')">Waiting for you</button><button onclick="jhGo('/setup')">Job criteria</button><button onclick="jhGo('/configuration')">Configuration</button></nav>
  <span class="stat" id="stat"></span>
</header>
<div id="toast" role="status" aria-live="polite"></div><div id="busy" aria-hidden="true"></div>
<main id="main"><div class="empty">Loading…</div></main>
<div class="bar" id="bar"></div>
<script>
const copyText=t=>window.jhCopy?window.jhCopy(t):navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject(new Error('Copy is not available here: select the text and press Ctrl+C'));
window.jhGo=window.jhGo||(p=>{location.href=p});  // in the app window, pages load through the app
let Q={review:[],waiting:[]},i=0,view='review',editing=false,pending=null;
const $=s=>document.querySelector(s), esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  jsq=s=>esc(JSON.stringify(String(s??'')));  // a value inside an inline onclick: a JS string literal, then HTML-escaped
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
const busy={n:0,t:0,go(){if(!this.n++)this.t=setTimeout(()=>$('#busy').classList.add('on'),150)},done(){if(!--this.n){clearTimeout(this.t);$('#busy').classList.remove('on')}}};
async function api(path,body){busy.go();try{const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Jobhunter':'1'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.statusText);return d}finally{busy.done()}}
async function load(keep){const d=await api('/api/queue');Q=d;if(!keep)i=0;i=Math.min(i,Math.max(0,Q.review.length-1));
  $('#stat').textContent=`${d.review.length} to review · ${d.waiting.length} waiting · ${d.submitted_today}/${d.daily_cap} sent today`+(d.profile_missing?' · ⚠ facts profile missing: nothing can be scored (see Configuration)':d.profile_approved?'':' · profile not approved yet')+(d.workers_alive?'':' · ⚠ background workers stopped: run scripts\\review.cmd');
  $('#t-waiting').textContent=`Waiting for you (${d.waiting.length})`;render()}
function tab(v){view=v;editing=false;for(const t of ['review','all','waiting'])$('#t-'+t).classList.toggle('on',v===t);$('#main').classList.toggle('wide',v==='all');history.replaceState(null,'','#'+v);if(v==='all'){if(!J)loadJobs();else renderAll()}else render()}
function letterHtml(c){if(!c.sentences.length)return esc(c.letter);let html=esc(c.letter);
  for(const s of c.sentences){if(s.kind!=='claim')continue;const t=esc(s.text.trim());const tip=esc(s.fact_ids.join(', ')+': '+s.facts.join(' | '));html=html.replace(t,`<span class="s-claim" title="${tip}">${t}</span>`)}return html}
function issues(v){if(!v)return'';const h=(v.hard||[]).map(x=>`<li class="bad">${esc(x)}</li>`).join(''),s=(v.soft||[]).map(x=>`<li class="warn">${esc(x)}</li>`).join('');return h||s?`<ul class="issues">${h}${s}</ul>`:'<p class="ok"><small>All claims match your facts.</small></p>'}
function answers(c){if(!c.answers||!c.answers.length)return'';return `<h3>Screening answers</h3><table><tr><th>Question</th><th>Answer</th><th></th></tr>`+c.answers.map((a,k)=>`<tr><td>${esc(a.question)}</td><td>${a.needs_jean?`<input type="text" id="ans${k}" placeholder="${esc(a.note||'your answer')}"><label><small><input type="checkbox" id="save${k}" checked> remember</small></label> <button class="btn" onclick="saveAns(${k})">Save</button>`:esc(a.answer)}</td><td><span class="src ${a.source}">${esc(a.source)}</span></td></tr>`).join('')+'</table>'}
function render(){const m=$('#main'),bar=$('#bar');if(view==='all')return;
  if(view==='waiting'){bar.innerHTML='';if(!Q.waiting.length){m.innerHTML='<div class="empty">Nothing is waiting for you.</div>';return}
    m.innerHTML=Q.waiting.map(c=>{const msg=c.route==='email'?'Approved, but the email was not sent. Open Configuration to check Gmail, or apply on the site instead.':c.url?'Apply on the site in your usual browser: paste the letter (and any screening answers), send it there, then press I applied.':'Apply the way the ad says, then press I applied.';
      return `<div class="card"><h2>${esc(c.title)}</h2><div class="pills"><span class="pill">${esc(c.company||'—')}</span><span class="pill">${esc(c.ats||(c.route==='web'?'apply on the site':c.route))}</span><span class="pill warn">apply now</span></div><p>${msg}</p>
      ${c.url?`<button class="btn go" onclick="window.open(${jsq(c.url)},'_blank')">Open in my usual browser</button> `:''}<button class="btn" onclick="copyLetter(${c.id})">Copy letter${c.answers&&c.answers.length?' and answers':''}</button> <button class="btn" onclick="act(${c.id},'submitted')">I applied</button> <button class="btn" onclick="act(${c.id},'reject',{reason:'gave up'})">Drop it</button></div>`}).join('')+'<div id="accts"></div>';loadAccounts();return}
  if(!Q.review.length){m.innerHTML='<div class="empty">Nothing to review. New letters arrive after each run.</div>';bar.innerHTML='';return}
  const c=Q.review[i],v=c.validation||{},sc=v.score??'—';
  m.innerHTML=`<div class="card"><div class="muted"><small>${i+1} of ${Q.review.length}</small></div><h2>${esc(c.title)}</h2>
   <div class="pills"><span class="pill">${esc(c.company||'—')}</span><span class="pill">${esc(c.location||'')}${c.remote?' · remote':''}</span><span class="pill">fit ${c.score??'—'}</span><span class="pill">${c.coverage!=null?Math.round(c.coverage*100)+'% of must-haves':''}</span><span class="pill ${sc>=85?'ok':sc>=70?'warn':'bad'}">checks ${sc}</span><span class="pill">${esc(c.route==='web'?(c.ats||'apply on the site'):c.route)}</span>${c.edited?'<span class="pill warn">edited</span>':''}</div>
   <div class="grid"><div><b>Why it fits</b><ul>${(c.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('')||'<li class="muted">—</li>'}</ul>${c.gaps.length?`<b>You don't have</b><ul>${c.gaps.map(g=>`<li class="muted">${esc(g)}</li>`).join('')}</ul>`:''}</div>
   <div><b>Checks</b>${issues(v)}${c.route==='email'?`<p><small>To <b>${esc(c.recipient||c.recipient_problem)}</b> · ${esc(c.attachment)}${c.attachment_problem?` <span class="bad">${esc(c.attachment_problem)}</span>`:''}</small></p>`:''}${c.url?`<p><small><a href="${esc(c.url)}" target="_blank" rel="noopener">Open the ad</a></small></p>`:''}</div></div>
   ${editing?`<textarea id="ed">${esc(c.letter)}</textarea>`:`<div class="letter">${letterHtml(c)}</div>`}
   ${answers(c)}</div>`;
  if(c.id!==shownId){m.firstElementChild.classList.add('enter');shownId=c.id}
  bar.innerHTML=editing?`<button class="go" onclick="saveEdit()">Save and recheck<kbd>Ctrl+Enter</kbd></button><button onclick="editing=false;render()">Cancel<kbd>Esc</kbd></button>`:
   `<button class="go" onclick="approve()">${c.route==='email'?'Approve &amp; send':'Approve &amp; apply'}<kbd>A</kbd></button><button onclick="editing=true;render();$('#ed').focus()">Edit<kbd>E</kbd></button><button onclick="showReasons()">Reject<kbd>R</kbd></button><button onclick="act(c_id(),'redraft')">Redraft<kbd>D</kbd></button><button onclick="move(-1)">Prev<kbd>K</kbd></button><button onclick="move(1)">Next<kbd>J</kbd></button>
   <div class="reasons" id="reasons">${Q.reasons.map((r,k)=>`<button onclick="reject('${r}')">${r}<kbd>${k+1}</kbd></button>`).join('')}</div>`}
let shownId=null;
const RETICLE='<svg class="reticle" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" fill="none" stroke="var(--acc)" stroke-width="3"/><circle cx="50" cy="50" r="22" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="4 4"/><g stroke="var(--acc)" stroke-width="3" stroke-linecap="round"><line x1="50" y1="6" x2="50" y2="30"/><line x1="50" y1="70" x2="50" y2="94"/><line x1="6" y1="50" x2="30" y2="50"/><line x1="70" y1="50" x2="94" y2="50"/></g><circle class="dot" cx="50" cy="50" r="6" fill="#ff3b30"/></svg>';
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,calm?0:ms));
// approve: the scope locks onto the card, then it zips away; reject: the card wobbles and misses
async function leave(kind='hit'){const el=$('#main .card');if(!el)return;shownId=null;if(kind==='hit'){el.insertAdjacentHTML('beforeend',RETICLE);await wait(400)}el.classList.add(kind);await wait(kind==='hit'?320:420)}
const c_id=()=>Q.review[i]&&Q.review[i].id;
function move(d){i=Math.max(0,Math.min(Q.review.length-1,i+d));render()}
function showReasons(){const r=$('#reasons');if(r)r.classList.toggle('on')}
let ACCTS=null;
async function copyLetter(id){try{const d=await api(`/api/jobs/${id}/handoff`);await copyText(d.copy);toast('Copied. Paste it into the application.')}catch(e){toast(e.message||'Copy failed',6000)}}
async function loadAccounts(){const el=$('#accts');if(!el)return;try{if(ACCTS===null)ACCTS=(await api('/api/accounts')).accounts||[];}catch(e){ACCTS=[]}
  if(!ACCTS.length){el.innerHTML='';return}
  el.innerHTML=`<div class="card"><h2>Saved job site passwords</h2><p class="muted"><small>Passwords an earlier version of Lock &amp; Land made for job site accounts. They are kept in your keychain only. Copying or forgetting one asks on this computer first.</small></p><table><tr><th>Site</th><th>Email</th><th></th></tr>${ACCTS.map((a,k)=>`<tr><td>${esc(a.site)}</td><td>${esc(a.email||'')}</td><td><button class="btn" onclick="acctPw(${k})">Copy password</button> <button class="btn" onclick="acctForget(${k})">Forget</button></td></tr>`).join('')}</table></div>`}
async function acctPw(k){try{const d=await api('/api/accounts/reveal',{site:ACCTS[k].site});await copyText(d.password);toast(d.done)}catch(e){toast(e.message,6000)}}
async function acctForget(k){if(!confirm(`Forget the saved account for ${ACCTS[k].site}?`))return;try{const d=await api('/api/accounts/forget',{site:ACCTS[k].site});ACCTS=null;toast(d.done);await load(true)}catch(e){toast(e.message,6000)}}
async function act(id,what,body={}){try{const d=await api(`/api/jobs/${id}/${what}`,body);toast(d.done||'Done');await load(true)}catch(e){render();toast(e.message,6000)}}
async function approve(extra={}){const c=Q.review[i];if(!c)return;try{const d=await api(`/api/jobs/${c.id}/approve`,extra);
  if(d.confirm){if(confirm(d.confirm)){const nx={...extra};if(d.confirm_email)nx.confirm_email=true;if(d.override)nx.override=true;return approve(nx)}return}
  let note=d.done||'Locked in! Approved';if(d.copy){try{await copyText(d.copy)}catch(e){note='Approved, but copying failed: use Copy letter on the Waiting tab. '+(e.message||'')}}if(d.open)window.open(d.open,'_blank');await leave();toast(note,7000);await load(true)}catch(e){toast(e.message,6000)}}
async function reject(reason){const id=c_id();await leave('miss');await act(id,'reject',{reason})}
async function saveEdit(){const c=Q.review[i];try{const d=await api(`/api/jobs/${c.id}/edit`,{letter:$('#ed').value});editing=false;await load(true);toast(d.validation.ok?'Saved. Checks pass.':'Saved, but some checks fail (red).',5000)}catch(e){toast(e.message,6000)}}
async function saveAns(k){const c=Q.review[i],a=c.answers[k];try{await api(`/api/jobs/${c.id}/answer`,{question:a.question,answer:$('#ans'+k).value,save:$('#save'+k).checked});toast('Answer saved');await load(true)}catch(e){toast(e.message)}}

/* ---------- All jobs ---------- */
let J=null,P={},open_=null;
const GROUPS={active:['queued','extracted','scored','generated','needs_review','approved','submitting','awaiting_click','needs_human','relocation','failed'],
  review:['needs_review'],applied:['submitted'],relocation:['relocation'],filtered:['filtered'],skipped:['rejected'],all:null};
const GL={active:'Open (not applied, not filtered)',review:'Letter ready',applied:'Applied',relocation:'Relocation needed',filtered:'Filtered out',skipped:'Skipped',all:'Everything'};
const MODES={remote:'Remote',hybrid:'Hybrid BCN',onsite:'On-site',unknown:'Not stated'};
let F={q:'',group:'active',modes:['remote','hybrid','onsite','unknown'],min:0,pay:0,src:'',sort:'best'};
try{Object.assign(F,JSON.parse(localStorage.getItem('jh_filters')||'{}'))}catch(e){}
const saveF=()=>{try{localStorage.setItem('jh_filters',JSON.stringify(F))}catch(e){}};
async function loadJobs(){try{const d=await api('/api/jobs');J=d.jobs;P=d.prefs;if(view==='all'){if($('#jl'))list();else renderAll()}}catch(e){toast(e.message,6000)}}
const k$=v=>v?'€'+Math.round(v/1000)+'k':'';
function filtered(){const q=F.q.trim().toLowerCase(),g=GROUPS[F.group];
  let r=J.filter(j=>(!g||g.includes(j.state))&&F.modes.includes(j.mode)&&(j.score??0)>=F.min&&(!F.pay||(j.salary&&j.salary>=F.pay))&&(!F.src||j.source===F.src)
    &&(!q||(j.title+' '+j.company+' '+j.location+' '+j.snippet).toLowerCase().includes(q)));
  const rank={remote:0,hybrid:1,unknown:2,onsite:3};
  if(F.sort==='new')r.sort((a,b)=>(b.posted||b.fetched).localeCompare(a.posted||a.fetched));
  else if(F.sort==='pay')r.sort((a,b)=>(b.salary||0)-(a.salary||0));
  else if(F.sort==='mode')r.sort((a,b)=>rank[a.mode]-rank[b.mode]||(b.score??-1)-(a.score??-1));
  else r.sort((a,b)=>(b.score??-1)-(a.score??-1));return r}
function renderAll(){const m=$('#main');$('#bar').innerHTML='';if(!J){m.innerHTML='<div class="empty">Loading…</div>';return}
  const srcs=[...new Set(J.map(j=>j.source))].sort(),cnt={};for(const j of J)for(const [g,st] of Object.entries(GROUPS))if(!st||st.includes(j.state))cnt[g]=(cnt[g]||0)+1;
  m.innerHTML=`<div class="filters"><input type="search" id="fq" placeholder="Search title, company, place, text…" value="${esc(F.q)}">
   <select id="fg">${Object.keys(GROUPS).map(g=>`<option value="${g}"${F.group===g?' selected':''}>${GL[g]} (${cnt[g]||0})</option>`).join('')}</select>
   <select id="fs"><option value="best"${F.sort==='best'?' selected':''}>Best fit first</option><option value="mode"${F.sort==='mode'?' selected':''}>Remote first</option><option value="new"${F.sort==='new'?' selected':''}>Newest first</option><option value="pay"${F.sort==='pay'?' selected':''}>Highest pay first</option></select></div>
   <div class="filters">${Object.entries(MODES).map(([k,l])=>`<span class="chipf${F.modes.includes(k)?' on':''}" data-m="${k}">${l}</span>`).join('')}
   <label>Min score <input type="number" id="fmin" min="0" max="100" step="5" value="${F.min}"></label>
   <label>Min pay € <input type="number" id="fpay" min="0" step="5000" value="${F.pay||''}" placeholder="any"></label>
   <select id="fsrc"><option value="">All sources</option>${srcs.map(x=>`<option${F.src===x?' selected':''}>${esc(x)}</option>`).join('')}</select>
   <button class="btn" onclick="F={q:'',group:'active',modes:['remote','hybrid','onsite','unknown'],min:0,pay:0,src:'',sort:'best'};saveF();renderAll()">Reset</button></div>
   <div class="muted" id="fcount" style="margin-bottom:8px"><small></small></div><div class="jl" id="jl"></div>
   <p class="muted"><small>Remote gets +5 (your first choice). Hybrid in Barcelona is neutral. Fully on-site needs pay of ${k$(P.onsite_min_salary_eur)} or more: below that it's filtered out, and with no pay stated it stays here but gets no automatic letter.</small></p>`;
  const on=(id,ev,f)=>$(id).addEventListener(ev,f);
  on('#fq','input',e=>{F.q=e.target.value;saveF();list()});on('#fg','change',e=>{F.group=e.target.value;saveF();list()});on('#fs','change',e=>{F.sort=e.target.value;saveF();list()});
  on('#fmin','input',e=>{F.min=+e.target.value||0;saveF();list()});on('#fpay','input',e=>{F.pay=+e.target.value||0;saveF();list()});on('#fsrc','change',e=>{F.src=e.target.value;saveF();list()});
  document.querySelectorAll('.chipf').forEach(c=>c.onclick=()=>{const k=c.dataset.m;F.modes=F.modes.includes(k)?F.modes.filter(x=>x!==k):[...F.modes,k];c.classList.toggle('on');saveF();list()});
  list()}
function list(){const r=filtered(),box=$('#jl');$('#fcount small').textContent=`${r.length} of ${J.length} jobs`;
  if(!r.length){box.innerHTML='<div class="empty">No jobs match these filters.</div>';return}
  box.innerHTML=r.slice(0,400).map(j=>{const sc=j.score,cl=sc==null?'lo':sc>=P.draft_score?'hi':sc>=60?'mid':'lo';
   return `<div class="jr" onclick="toggleJ(${j.id})"><div class="sc ${cl}">${sc??'–'}</div><div><div class="t">${esc(j.title)}</div><div class="sub">${esc(j.company||'—')} · ${esc(j.location)}${j.posted?' · '+esc(j.posted):''}</div></div>
   <div><span class="mode ${j.mode}">${MODES[j.mode]}</span></div><div class="hide-s">${j.salary?k$(j.salary):'<span class="muted">pay ?</span>'}</div><div class="hide-s"><small>${esc(j.stage)}</small></div></div>${open_===j.id?detail(j):''}`}).join('')+(r.length>400?`<div class="empty">Showing the first 400. Narrow the filters to see more.</div>`:'')}
function detail(j){const st=j.state,canDraft=['scored','failed','relocation','queued','extracted','filtered','rejected'].includes(st),canSkip=['scored','relocation','needs_review','failed'].includes(st),canApplied=!['submitted','queued','extracted','generated','rejected'].includes(st);
  return `<div class="det"><p><b>${esc(j.fit)}</b>${j.coverage!=null?` · ${Math.round(j.coverage*100)}% of must-haves match`:''} · ${esc(j.source)} · ${esc(j.stage)}</p>
  ${j.why?`<p class="warn">${esc(j.why)}</p>`:''}${j.reasons.length?`<ul>${j.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${j.red_flags.length?`<ul>${j.red_flags.map(x=>`<li class="bad">${esc(x)}</li>`).join('')}</ul>`:''}
  ${j.gaps.length?`<p class="muted"><small>You don't have: ${j.gaps.map(esc).join(' · ')}</small></p>`:''}${j.snippet?`<p class="muted"><small>${esc(j.snippet)}…</small></p>`:''}
  <div>${j.url?`<button class="btn" onclick="event.stopPropagation();window.open(${jsq(j.url)},'_blank')">Open the ad</button>`:''}
  ${st==='needs_review'?`<button class="btn" onclick="event.stopPropagation();goReview(${j.id})">Review the letter</button>`:''}
  ${canDraft?`<button class="btn" onclick="event.stopPropagation();jact(${j.id},'redraft')">Write letter</button>`:''}
  ${['filtered','rejected'].includes(st)?`<button class="btn" onclick="event.stopPropagation();jact(${j.id},'restore')">Bring back</button>`:''}
  ${canSkip?`<button class="btn" onclick="event.stopPropagation();jact(${j.id},'reject',{reason:'skipped from list'})">Skip</button>`:''}
  ${canApplied?`<button class="btn" onclick="event.stopPropagation();if(confirm('Mark as applied?'))jact(${j.id},'submitted')">I applied</button>`:''}</div></div>`}
function toggleJ(id){open_=open_===id?null:id;list();const d=$('#jl .det');if(d)d.classList.add('enter')}
async function jact(id,what,body={}){try{const d=await api(`/api/jobs/${id}/${what}`,body);toast(d.done||'Done');await loadJobs();load(true)}catch(e){toast(e.message,6000)}}
async function goReview(id){  // show the letter at once from what's loaded; refresh quietly behind it
  const pick=()=>{const k=Q?Q.review.findIndex(c=>c.id===id):-1;if(k>=0)i=k;return k>=0};
  if(pick()){tab('review');await load(true);pick();render();return}
  try{const c=await api(`/api/jobs/${id}/card`);Q=Q||{review:[],waiting:[]};Q.review=[c,...Q.review.filter(x=>x.id!==id)];i=0;tab('review')}
  catch(e){toast(e.message,6000)}load(true).then(()=>{pick();if(view==='review')render()})}
document.addEventListener('keydown',e=>{if(view!=='review')return;const typing=['TEXTAREA','INPUT'].includes(document.activeElement.tagName);
  if(editing){if(e.key==='Escape'){editing=false;render()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))saveEdit();return}if(typing)return;
  const r=$('#reasons'),k=e.key.toLowerCase();if(r&&r.classList.contains('on')&&/^[1-9]$/.test(e.key)){const reason=Q.reasons[+e.key-1];if(reason)reject(reason);return}
  if(k==='a')approve();else if(k==='e'){editing=true;render();$('#ed').focus();e.preventDefault()}else if(k==='r')showReasons();else if(k==='j')move(1);else if(k==='k')move(-1);else if(k==='d')act(c_id(),'redraft');else if(e.key==='Escape'&&r)r.classList.remove('on')});
load();setInterval(()=>{if(!editing&&document.visibilityState==='visible'){load(true);if(view==='all')loadJobs()}},30000);
const HASH=window.JH_HASH||location.hash;if(['#waiting','#all'].includes(HASH))tab(HASH.slice(1));
</script>
